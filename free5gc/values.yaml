# Default values for free5gc-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: free5gc
  userPlaneArchitecture: single  # possible values are "single" and "ulcl"
  nrf:
    service:
      name: nrf-nnrf
      type: ClusterIP
      port: "8000"
      nodePort: "30800"
  sbi:
    scheme: http
  amf:
    n2if:  # NGAP
      ipAddress: 10.212.14.26
    service:
      ngap:
        enabled: false
        name: amf-n2
        port: 38412
        nodeport: 31412
        protocol: SCTP
        type: NodePort
  smf:
    n4if:
      ipAddress: 10.212.14.28
  #Global network parametes
  # n2network:
  #   enabled: true
  #   name: n2network
  #   type: ipvlan
  #   masterIf: ens160
  #   subnetIP: 192.168.1.0
  #   cidr: 24
  #   gatewayIP: 192.168.1.25
  #   excludeIP: 192.168.1.25
  n3network:
    enabled: true
    name: n3network
    type: ipvlan
    masterIf: eno12409np1
    subnetIP: 10.212.14.0
    cidr: 24
    gatewayIP: 10.212.14.1
    excludeIP: 110.212.14.1
  n4network:
    enabled: true
    name: n4network
    type: ipvlan
    masterIf: eno12409np1
    subnetIP: 10.212.14.0
    cidr: 24
    gatewayIP: 10.212.14.1
    excludeIP: 10.212.14.1
  n6network:
    enabled: true
    name: n6network
    type: ipvlan
    masterIf: eno12409np1
    subnetIP: 10.212.14.0
    cidr: 24
    gatewayIP: 10.212.14.1
    excludeIP: 10.212.14.1
  n9network:
    enabled: true
    name: n9network
    type: ipvlan
    masterIf: eno12409np1
    subnetIP: 10.212.14.0
    cidr: 24
    gatewayIP: 10.212.14.1
    excludeIP: 10.212.14.1


# These parameters can be used to enable/disable deployment of subcharts
deployUpf: true

